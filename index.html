/* Layout: listing marketplace — sticky filter bar, card grid sorted by date, status chips; bilingual zh/en */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#17201c; --muted:#5d6b64; --line:#d9e0db;
  --accent:#1f6f54; --accent-soft:#e1efe8; --gold:#b7791f; --gold-soft:#fbf0dc;
  --danger:#b4372f; --danger-soft:#fbe5e2;
  --display:"Noto Sans SC",system-ui,sans-serif; --body:"Noto Sans SC",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111714; --surface:#19211d; --fg:#e6ece8; --muted:#9aa8a1; --line:#2b3631;
  --accent:#5fc49b; --accent-soft:#1d3a2e; --gold:#e3ad5a; --gold-soft:#3a2e19;
  --danger:#f08a80; --danger-soft:#3f1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211d; --fg:#e6ece8; --muted:#9aa8a1; --line:#2b3631;
  --accent:#5fc49b; --accent-soft:#1d3a2e; --gold:#e3ad5a; --gold-soft:#3a2e19;
  --danger:#f08a80; --danger-soft:#3f1f1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:28px 16px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--mono);font-size:13px;color:var(--accent);letter-spacing:.04em}
.brand-r{display:flex;gap:8px;align-items:center}
.submit{font-size:13px;font-weight:500;text-decoration:none;color:var(--bg);background:var(--accent);border-radius:999px;padding:4px 14px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--muted);padding:4px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,4vw,38px);line-height:1.2;margin:10px 0 0;text-wrap:balance;letter-spacing:.01em}
.sub{color:var(--muted);margin:8px 0 0;max-width:72ch}
.alert{margin-top:16px;display:flex;gap:10px;align-items:flex-start;background:var(--danger-soft);color:var(--fg);border:1px solid var(--danger);border-radius:8px;padding:10px 14px}
.alert b{color:var(--danger);white-space:nowrap}
.stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:13px}
.stats strong{font-family:var(--mono);color:var(--fg);font-size:18px;margin-right:4px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px}
.bar .wrap{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs button,.chip{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 14px}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip{font-size:13px;padding:3px 12px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search]{font:inherit;flex:1;min-width:0;max-width:340px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-right:2px}
main{padding-block:20px 48px}
.section-h{font-family:var(--display);font-weight:700;font-size:18px;margin:24px 0 12px;display:flex;align-items:baseline;gap:8px}
.section-h span{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.is-past{opacity:.7}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.date{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:500;font-variant-numeric:tabular-nums}
.status{font-size:12px;border-radius:4px;padding:1px 8px;white-space:nowrap;font-weight:500}
.s-open{background:var(--accent-soft);color:var(--accent)}
.s-soon{background:var(--danger-soft);color:var(--danger)}
.s-tbc{background:var(--gold-soft);color:var(--gold)}
.s-past{background:var(--line);color:var(--muted)}
.card h3{margin:0;font-size:16px;line-height:1.4;font-weight:700;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 7px;color:var(--muted)}
.tag.loc{color:var(--fg)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
dt{color:var(--muted);white-space:nowrap}
dd{margin:0;min-width:0;overflow-wrap:anywhere}
.note{font-size:12px;color:var(--gold);background:var(--gold-soft);border-radius:6px;padding:4px 8px}
.card a.go{margin-top:auto;align-self:flex-start;color:var(--accent);font-weight:500;text-decoration:none;border-bottom:1px solid currentColor}
.empty{color:var(--muted);padding:40px 0;text-align:center}
footer{color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-block:20px 40px}
footer a{color:var(--muted)}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
</style>

];

let lang="zh";
try{const s=localStorage.getItem("gh-lang"); if(s==="zh"||s==="en") lang=s; else if(!/^zh/i.test(navigator.language||"")) lang="en";}catch(e){ if(!/^zh/i.test(navigator.language||"")) lang="en"; }
const L = v => Array.isArray(v) ? v[lang==="zh"?0:1] : (v===T ? UI[lang].TBA : v);
const u = k => UI[lang][k];

const fmtD = s => { if(!s) return ""; const [y,m,d]=s.split("-"); return `${y}.${m}.${d}`; };
function status(x){
  if(x.past) return "past";
  if(x.status) return x.status;
  const end = x.dlDate || x.e || x.s;
  if(end && end < TODAY) return "past";
  const ref = x.dlDate || x.s;
  if(ref){ const days=(new Date(ref)-new Date(TODAY))/864e5; if(days<=10) return (x.dlDate?"closing":"soon"); }
  return "open";
}
const CLS={open:"s-open",soon:"s-soon",closing:"s-soon",tbc:"s-tbc",past:"s-past"};
D.forEach(x=>{x.st=status(x);});

let state={type:"all",city:"all",q:"",openOnly:false,showPast:false};
const AUS=["syd","mel","bne","cbr","per","adl","au"];
const CITIES=["all","aus","syd","mel","bne","cbr","per","adl","au","online","global"];
const cbox=document.getElementById("cities");
CITIES.forEach(c=>{const b=document.createElement("button");b.type="button";b.className="chip";b.dataset.city=c;b.setAttribute("aria-pressed",c===state.city);b.onclick=()=>{state.city=c;cbox.querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed",z===b));render();};cbox.appendChild(b);});

document.querySelectorAll(".tabs button").forEach(b=>{b.onclick=()=>{state.type=b.dataset.type;document.querySelectorAll(".tabs button").forEach(z=>z.setAttribute("aria-pressed",z===b));render();};});
document.getElementById("q").oninput=e=>{state.q=e.target.value.trim().toLowerCase();render();};
const tog=(id,k)=>{const b=document.getElementById(id);b.onclick=()=>{state[k]=!state[k];b.setAttribute("aria-pressed",state[k]);render();};};
tog("openOnly","openOnly");tog("showPast","showPast");
document.querySelectorAll(".lang button").forEach(b=>{b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem("gh-lang",lang)}catch(e){};applyLang();};});

function applyLang(){
  document.documentElement.lang = lang==="zh"?"zh-CN":"en";
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=u(el.dataset.i);});
  document.getElementById("q").placeholder=u("q");
  cbox.querySelectorAll("button").forEach(b=>{b.textContent=UI[lang].cities[b.dataset.city];});
  render();
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function card(x){
  const label=u("s_"+x.st);
  const when = x.t!=="hack" ? (x.dlDate?`${u("due")} ${fmtD(x.dlDate)}`:(x.s?`${u("approx")} ${fmtD(x.s).slice(0,7)}`:u("rolling"))) : (fmtD(x.s)+(x.e?` – ${fmtD(x.e).slice(5)}`:""));
  const rows=[[u("org"),L(x.org)],[u("focus"),L(x.focus)],[x.t==="inc"?u("prizeI"):(x.t==="fund"?u("prizeF"):u("prizeH")),L(x.prize)],[x.t!=="hack"?u("apply"):u("reg"),L(x.dl)]];
  if(x.fee) rows.push([u("fee"),L(x.fee)]);
  if(x.prog) rows.push([u("prog"),L(x.prog)]);
  if(x.elig) rows.push([u("elig"),L(x.elig)]);
  const city = x.city ? L(x.city) : UI[lang].cities[x.c];
  const kind = x.t==="hack"?u("kHack"):(x.t==="fund"?u("kFund"):u("kInc"));
  return `<article class="card${x.st==="past"?" is-past":""}">
    <div class="top"><span class="date">${esc(when)}</span><span class="status ${CLS[x.st]}">${esc(label)}</span></div>
    <h3>${esc(L(x.n))}</h3>
    <div class="meta"><span class="tag loc">${esc(city)}</span><span class="tag">${esc(UI[lang].fmt[x.fmt])}</span><span class="tag">${esc(kind)}</span></div>
    <dl>${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    ${x.note?`<div class="note">${esc(L(x.note))}</div>`:""}
    <a class="go" href="${esc(x.u)}" target="_blank" rel="noopener">${esc(u("go"))}</a>
  </article>`;
}
const hay = x => ["n","org","focus","city"].map(k=>Array.isArray(x[k])?x[k].join(" "):(x[k]||"")).join(" ")+" "+UI.zh.cities[x.c]+" "+UI.en.cities[x.c];
function render(){
  let list=D.filter(x=>{
    if(state.type!=="all"&&x.t!==state.type) return false;
    if(!state.showPast&&x.st==="past") return false;
    if(state.openOnly&&!["open","soon","closing"].includes(x.st)) return false;
    if(state.city==="aus"){ if(!AUS.includes(x.c)) return false; } else if(state.city!=="all"&&x.c!==state.city) return false;
    if(state.q&&!hay(x).toLowerCase().includes(state.q)) return false;
    return true;
  });
  const key=x=>(x.dlDate||x.s||"9999");
  list.sort((a,b)=>key(a).localeCompare(key(b)));
  const groups=[["gAus",x=>x.t==="hack"&&x.fmt!=="on"&&x.st!=="past"],["gOnline",x=>x.t==="hack"&&x.fmt==="on"&&x.st!=="past"],["gInc",x=>x.t==="inc"&&x.st!=="past"],["gFund",x=>x.t==="fund"&&x.st!=="past"],["gPast",x=>x.st==="past"]];
  const html=groups.map(([h,f])=>{const g=list.filter(f); return g.length?`<h2 class="section-h">${esc(u(h))}<span>${g.length} ${esc(u("items"))}</span></h2><div class="grid">${g.map(card).join("")}</div>`:"";}).join("");
  document.getElementById("list").innerHTML=html||`<p class="empty">${esc(u("empty"))}</p>`;
  const live=D.filter(x=>x.st!=="past");
  const n=f=>live.filter(f).length;
  document.getElementById("stats").innerHTML=`<span><strong>${n(x=>x.t==="hack"&&x.fmt!=="on")}</strong>${esc(u("stHack"))}</span><span><strong>${n(x=>x.t==="hack"&&x.fmt==="on")}</strong>${esc(u("stOnline"))}</span><span><strong>${n(x=>x.t==="inc")}</strong>${esc(u("stInc"))}</span><span><strong>${n(x=>x.t==="fund")}</strong>${esc(u("stFund"))}</span>`;
}
// ---- Community submissions (Google Form → published CSV) ----
const SUBMIT_FORM_URL = "";  // Google Form link, shown as the Submit button
const SUBMIT_CSV_URL  = "";  // response sheet published to web as CSV
function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++;}else q=false;}else f+=ch;}else if(ch=='"')q=true;else if(ch==','){r.push(f);f="";}else if(ch=='\n'){r.push(f);rows.push(r);r=[];f="";}else if(ch!='\r')f+=ch;}if(f||r.length){r.push(f);rows.push(r);}return rows;}
function toISO(v){v=(v||"").trim();if(!v)return "";let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m){let d=+m[1],mo=+m[2];if(mo>12){[d,mo]=[mo,d];}return `${m[3]}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;}return "";}
function cityKeyOf(v){v=(v||"").toLowerCase();const map=[["online","online"],["sydney","syd"],["melbourne","mel"],["brisbane","bne"],["canberra","cbr"],["perth","per"],["adelaide","adl"],["australia","au"],["overseas","global"],["global","global"]];for(const [k,c] of map) if(v.includes(k)) return c;return "au";}
async function loadSubmissions(){
  if(!SUBMIT_CSV_URL) return;
  try{
    const res=await fetch(SUBMIT_CSV_URL,{cache:"no-store"}); if(!res.ok) return;
    const rows=parseCSV(await res.text()); if(rows.length<2) return;
    const H=rows[0].map(h=>h.toLowerCase());
    const col=k=>H.findIndex(h=>h.includes(k));
    const C={name:col("event name"),type:col("type"),start:col("start date"),end:col("end date"),dl:col("deadline"),city:col("city"),org:col("organiser"),prize:col("prize"),desc:col("description"),link:col("link")};
    const g=(r,k)=>C[k]>=0?(r[C[k]]||"").trim():"";
    rows.slice(1).forEach(r=>{
      const name=g(r,"name"), link=g(r,"link");
      if(!name||!/^https?:\/\//i.test(link)) return;
      const ty=g(r,"type").toLowerCase();
      const t=ty.includes("hackathon")?"hack":(ty.includes("grant")?"fund":"inc");
      const c=cityKeyOf(g(r,"city"));
      const x={t,n:name,s:toISO(g(r,"start")),e:toISO(g(r,"end"))||undefined,dlDate:toISO(g(r,"dl"))||undefined,c,fmt:c==="online"?"on":(t==="fund"?"app":"off"),
        org:g(r,"org")||T,focus:g(r,"desc")||T,prize:g(r,"prize")||T,dl:toISO(g(r,"dl"))||T,
        note:["社区提交 · 未核实，请以官网为准","Community submitted · not yet verified, check the official site"],community:true,u:link};
      if(!x.s&&!x.dlDate) x.status="tbc";
      x.st=status(x); D.push(x);
    });
    render();
  }catch(e){}
}
if(SUBMIT_FORM_URL){const a=document.getElementById("submitBtn"); if(a){a.href=SUBMIT_FORM_URL;a.hidden=false;}}
applyLang();
loadSubmissions();
</script>
